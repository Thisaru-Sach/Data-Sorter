name: Build Data Sorter

on:
  workflow_dispatch:      # "Run workflow" button in the Actions tab
  push:
    tags: ["v*"]          # or push a tag like v1.0

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-build.txt
      - run: python test_sorter.py
      - run: pyinstaller --noconfirm --clean --windowed --name DataSorter main.py

      - name: Zip macOS app (keeps permissions)
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/DataSorter.app DataSorter-mac.zip

      - name: Upload Windows build
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: DataSorter-windows
          path: dist/DataSorter

      - name: Upload macOS build
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: DataSorter-mac
          path: DataSorter-mac.zip
