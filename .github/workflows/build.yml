name: Build Data Sorter

on:
  workflow_dispatch:      # "Run workflow" button in the Actions tab
  push:
    tags: ["v*"]          # push a tag like v1.0.0 to publish a release

permissions:
  contents: write         # needed to create the release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-build.txt
      - run: python test_sorter.py
      - run: python -m PyInstaller --noconfirm --clean --windowed --name DataSorter main.py

      - name: Zip Windows build
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/DataSorter -DestinationPath DataSorter-windows.zip

      - name: Zip macOS app (keeps permissions)
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/DataSorter.app DataSorter-mac.zip

      - uses: actions/upload-artifact@v4
        with:
          name: DataSorter-${{ matrix.name }}
          path: DataSorter-${{ matrix.name }}.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: zips
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: zips/*.zip
          generate_release_notes: true
